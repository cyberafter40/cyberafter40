name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: types, lint, and the four suites that need no infrastructure.
  app:
    name: App — types, lint, domain and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Domain tests
        run: npm test -- --ci

      - name: UI tests
        run: npm run test:ui -- --ci

  backend:
    name: Backend — replay, security rules and Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore and Auth emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install functions
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Result-validation tests
        run: npm test -- --ci
        working-directory: functions

      # Starts and stops the emulators around the suite. Covers every allow/deny
      # path in firestore.rules plus all three Cloud Functions. A failure here is
      # a release blocker: a permissive rule is invisible until it is exploited.
      - name: Security rules and Cloud Functions (emulator)
        run: npm run test:emulator
        working-directory: functions

  e2e:
    name: End to end — the real app against the emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore and Auth emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app
        run: npm ci

      - name: Install functions
        run: npm ci
        working-directory: functions

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Bundles the web build, starts Firestore/Auth/Functions, serves the
      # bundle and drives it with a browser. This is the only suite where the
      # real app talks to a real backend.
      - name: End-to-end suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
